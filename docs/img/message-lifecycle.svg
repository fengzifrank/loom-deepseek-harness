<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f8cff"/></marker>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3ecf8e"/></marker>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <rect width="960" height="620" fill="#0b0f17"/>
  <text x="480" y="44" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">一条消息的一生</text>
  <text x="480" y="70" text-anchor="middle" fill="#8a99b5" font-size="13">一切事实先进日志，再流向任何地方 —— 所以刷新=重放 · 断线=续传 · 事后=回放审计</text>

  <!-- 前端 -->
  <rect x="40" y="240" width="150" height="120" rx="14" fill="#141b2b" stroke="#4f8cff" stroke-width="1.5"/>
  <text x="115" y="278" text-anchor="middle" fill="#4f8cff" font-size="16" font-weight="700">🖥 前端</text>
  <text x="115" y="304" text-anchor="middle" fill="#8a99b5" font-size="12">只是传话筒+显示器</text>
  <text x="115" y="326" text-anchor="middle" fill="#5d7290" font-size="11">POST 消息 / 收 SSE</text>

  <!-- runtime -->
  <rect x="250" y="240" width="160" height="120" rx="14" fill="#141b2b" stroke="#8a99b5" stroke-width="1.2"/>
  <text x="330" y="278" text-anchor="middle" fill="#dbe4f3" font-size="16" font-weight="700">Loom runtime</text>
  <text x="330" y="304" text-anchor="middle" fill="#8a99b5" font-size="12">路由 · 身份 · 归属校验</text>
  <text x="330" y="326" text-anchor="middle" fill="#5d7290" font-size="11">唤醒 agent</text>

  <!-- 日志 -->
  <rect x="470" y="120" width="180" height="470" rx="14" fill="#1a2336" stroke="url(#g2)" stroke-width="2"/>
  <text x="560" y="155" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">📜 会话日志</text>
  <text x="560" y="180" text-anchor="middle" fill="#9ecbff" font-size="12">append-only · seq 连续</text>
  <g font-size="11.5" fill="#8a99b5">
    <text x="560" y="215" text-anchor="middle">① user/message（永不丢）</text>
    <text x="560" y="245" text-anchor="middle">④ assistant/chunk（逐字）</text>
    <text x="560" y="275" text-anchor="middle">⑦ tool/call + result</text>
    <text x="560" y="305" text-anchor="middle">⑧ turn/end（结局）</text>
  </g>
  <g font-size="11" fill="#5d7290">
    <text x="560" y="360" text-anchor="middle">→ deriveMessages 模型上下文</text>
    <text x="560" y="382" text-anchor="middle">→ fork 从任意时刻分叉</text>
    <text x="560" y="404" text-anchor="middle">→ resume 重启恢复</text>
    <text x="560" y="426" text-anchor="middle">→ eval 夹具回归资产</text>
    <text x="560" y="448" text-anchor="middle">→ 审计（谁在何时做了什么）</text>
  </g>
  <text x="560" y="560" text-anchor="middle" fill="#3ecf8e" font-size="12" font-weight="700">唯一事实来源</text>

  <!-- agent 循环 -->
  <rect x="710" y="100" width="210" height="200" rx="14" fill="#141b2b" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="815" y="132" text-anchor="middle" fill="#7c5cff" font-size="16" font-weight="700">🤖 Agent 回合循环</text>
  <g font-size="12" fill="#8a99b5">
    <text x="815" y="160" text-anchor="middle">② 从日志派生上下文</text>
    <text x="815" y="184" text-anchor="middle">③ 思考（deepseek-v4-flash）</text>
    <text x="815" y="208" text-anchor="middle">⑤ 决定调用工具</text>
    <text x="815" y="232" text-anchor="middle">⑥ 过策略口子</text>
    <text x="815" y="256" text-anchor="middle">allow / deny / approve</text>
  </g>
  <text x="815" y="286" text-anchor="middle" fill="#5d7290" font-size="11">多 step 直到不欠任何东西</text>

  <!-- 工具 -->
  <rect x="710" y="340" width="210" height="110" rx="14" fill="#141b2b" stroke="#f5b455" stroke-width="1.2"/>
  <text x="815" y="374" text-anchor="middle" fill="#f5b455" font-size="16" font-weight="700">🛠 工具</text>
  <text x="815" y="400" text-anchor="middle" fill="#8a99b5" font-size="12">查数据 / 改数据 / 画图 / Python</text>
  <text x="815" y="422" text-anchor="middle" fill="#5d7290" font-size="11">写操作 → 审批卡等人裁决</text>

  <!-- 投影 -->
  <rect x="40" y="430" width="150" height="110" rx="14" fill="#141b2b" stroke="#3ecf8e" stroke-width="1.2"/>
  <text x="115" y="464" text-anchor="middle" fill="#3ecf8e" font-size="16" font-weight="700">📊 投影</text>
  <text x="115" y="490" text-anchor="middle" fill="#8a99b5" font-size="12">文字 · 工具卡片</text>
  <text x="115" y="512" text-anchor="middle" fill="#5d7290" font-size="11">图表 · 任务 · 地图</text>

  <!-- 箭头 -->
  <line x1="190" y1="290" x2="245" y2="290" stroke="#4f8cff" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="410" y1="280" x2="465" y2="240" stroke="#4f8cff" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="650" y1="200" x2="705" y2="180" stroke="#7c5cff" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="815" y1="300" x2="815" y2="335" stroke="#f5b455" stroke-width="2" marker-end="url(#ar2)"/>
  <path d="M 815 450 L 815 500 L 560 530 L 200 500 L 115 545" fill="none" stroke="#3ecf8e" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="470" y="515" fill="#3ecf8e" font-size="12" text-anchor="middle">⑨ SSE 直播（seq 编号，断线续传）</text>

  <text x="480" y="600" text-anchor="middle" fill="#5d7290" font-size="11.5">loom-deepseek-harness · 精确时序图见 docs/diagrams.zh.md 图 3</text>
</svg>
